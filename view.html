<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduArt Interactive</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #app-container, iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="app-container"></div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const lang = urlParams.get('lang') || 'ar';
      const key = urlParams.get('key');
      
      const SECRET_KEY = "edu2026";
      // استبدلي هذا الرابط برابط صفحة الكمين الخاصة بكِ
      const TRAP_PAGE_URL = "https://edu-art-3d-book.my.canva.site/space-trap"; 

      // 1. التحقق من مفتاح الحماية
      if (key !== SECRET_KEY) {
        window.location.href = TRAP_PAGE_URL;
        return;
      }

      // 2. تنظيف شريط العنوان فوراً ومسح المفتاح السري!
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?id=${id}&lang=${lang}`;
      window.history.replaceState({path: cleanUrl}, '', cleanUrl);

      // 3. خريطة الروابط (استبدلي your-username باسم حسابك الحقيقي)
      const modelsBaseUrls = {
"spacesuit": "https://edu-art-3d.github.io/Eduart-spacesuit-3D/",
"hubble": "https://edu-art-3d.github.io/Eduart-hubble-3D/",
"sun": "https://edu-art-3d.github.io/Eduart-sun-3D/",
"mercury": "https://edu-art-3d.github.io/Eduart-mercury-3D/",
"venus": "https://edu-art-3d.github.io/Eduart-venus-3D/",
"earth": "https://edu-art-3d.github.io/Eduart-earth-3D/",
"moon": "https://edu-art-3d.github.io/Eduart-moon-3D/",
"mars": "https://edu-art-3d.github.io/Eduart-mars-3D/",
"jupiter": "https://edu-art-3d.github.io/Eduart-jupiter-3D/",
"saturn": "https://edu-art-3d.github.io/Eduart-saturn-3D/",
"neptune": "https://edu-art-3d.github.io/Eduart-neptune-3D/",
"pluto": "https://edu-art-3d.github.io/Eduart-pluto-3D/",
"solarsystem": "https://edu-art-3d.github.io/Eduart-solarsystem-3D/",
"uranus": "https://edu-art-3d.github.io/Eduart-uranus-3D/"
      };

      const selectedModel = modelsBaseUrls[id];

      if (selectedModel) {
        // فتح نموذج الفيل داخل iframe وتمرير المفتاح له
        const targetUrl = selectedModel + "?key=" + SECRET_KEY;
        document.getElementById('app-container').innerHTML = `<iframe src="${targetUrl}" allow="camera; microphone; ar"></iframe>`;
      } else {
        window.location.href = TRAP_PAGE_URL;
      }
    })();
  </script>

</body>
</html>
